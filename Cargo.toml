[package]
name = "appic_dex"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
opt-level = 'z'


[[bin]]
name = "sqrtx96_to_tick"
path = "./bin/sqrtx96_to_tick.rs"


[[bin]]
name = "price_to_tick"
path = "./bin/price_to_tick.rs"

[[bin]]
name = "token_order"
path = "./bin/token_order.rs"



[dependencies]

candid = "0.10"
ic-cdk = "0.18.5"

ic-cdk-timers = "0.11" 
ic-stable-structures="0.6.5"
icrc-ledger-client = "0.1.3"

icrc-ledger-types = "0.1.10"
ic-canister-log = "0.2.0"
ic-sha3="1.0.0"


hex = { version = "0.4.3", features = ["serde"] }


minicbor = { version = "0.26.3",features = ["derive","alloc"] }
rlp = "0.6.1"

num-bigint = "0.4"
num-traits = "0.2"
ethnum = "1.5.2"
lazy_static = "1.4"
log = "0.4"

serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "^1.0.107" }

async-trait = "0.1.88"

[dev-dependencies]
proptest="1.4.0"
pocket-ic = "9.0.0"
serde_bytes = "0.11.17"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[features]
integration = []
